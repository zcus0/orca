[package]
name = "orca-shell-app"
version = "0.1.0"
description = "Orca Shell - the upstream desktop renderer in a Tauri shell, runtime stays upstream orcad on the real profile"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
sysinfo = "0.32"
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread"] }
orca-daemon-rs = { path = "../../daemon-rs" }

[profile.release]
lto = true
codegen-units = 1
