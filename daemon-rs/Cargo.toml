[package]
name = "orca-daemon-rs"
version = "0.3.1"
edition = "2021"
description = "Fase 3: native Rust rewrite of the Orca daemon (orcad). M1: reads the original Orca profile (installation identity, paired devices, host E2EE keypair), serves a status endpoint and the client WebSocket endpoint. Pairing/RPC compatibility lands in M2+; see ../FASE3-PLAN.md."

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde_json = "1"
sha2 = "0.10"
hkdf = "0.12"
xsalsa20poly1305 = "0.9"
x25519-dalek = { version = "2", features = ["static_secrets"] }
base64 = "0.22"
ed25519-dalek = "2"
getrandom = "0.3"
rusqlite = { version = "0.34", features = ["bundled"] }
portable-pty = "0.9"

[profile.release]
opt-level = 3
