[package]
name = "orca-rust-app"
version = "0.3.1"
description = "Orca Rust - full-Rust Orca desktop: the orca-daemon-rs daemon linked in-process, no Node"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
orca-daemon-rs = { path = "../../daemon-rs" }

[profile.release]
lto = true
codegen-units = 1
